# Publica as funções do servidor (assinatura com Mercado Pago) no Supabase.
# Roda quando as funções mudam (ramo teste ou main) ou pelo botão "Run workflow".
# Precisa dos segredos do repositório: SUPABASE_ACCESS_TOKEN (obrigatório),
# MP_ACCESS_TOKEN e MP_WEBHOOK_SECRET (do Mercado Pago). Sem eles, só avisa e não faz nada.
name: Publicar funções do servidor

on:
  workflow_dispatch:
  push:
    branches: [teste, main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/funcoes.yml"

concurrency:
  group: funcoes
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      PROJETO: bfpysalsisszdhzceade
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
      MP_WEBHOOK_SECRET: ${{ secrets.MP_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Testar as regras antes de publicar
        run: |
          cd testes
          node funcoes.test.mjs

      - name: Conferir segredos
        id: seg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Falta o segredo SUPABASE_ACCESS_TOKEN no GitHub. As funções não foram publicadas."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.seg.outputs.ok == '1'
        with:
          version: latest

      - name: Publicar funções
        if: steps.seg.outputs.ok == '1'
        run: |
          supabase functions deploy assinatura --project-ref "$PROJETO" --no-verify-jwt --use-api
          supabase functions deploy mp-webhook --project-ref "$PROJETO" --no-verify-jwt --use-api

      - name: Guardar segredos do Mercado Pago nas funções
        if: steps.seg.outputs.ok == '1'
        run: |
          args="APP_URL=https://viegas09.github.io/financas-casal/"
          [ -n "$MP_ACCESS_TOKEN" ] && args="$args MP_ACCESS_TOKEN=$MP_ACCESS_TOKEN"
          [ -n "$MP_WEBHOOK_SECRET" ] && args="$args MP_WEBHOOK_SECRET=$MP_WEBHOOK_SECRET"
          supabase secrets set --project-ref "$PROJETO" $args > /dev/null
          [ -z "$MP_ACCESS_TOKEN" ] && echo "::warning::Falta MP_ACCESS_TOKEN (Mercado Pago)." || true
          [ -z "$MP_WEBHOOK_SECRET" ] && echo "::warning::Falta MP_WEBHOOK_SECRET (assinatura secreta dos avisos do Mercado Pago)." || true
          echo "Funções publicadas. Endereço dos avisos: https://$PROJETO.supabase.co/functions/v1/mp-webhook"
