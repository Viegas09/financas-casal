name: Publicar na Cloudflare

# Publica o Plinc na Cloudflare Pages depois que os testes passam:
#   ramo main  → app.useplinc.com.br (app real) e useplinc.com.br (página de venda)
#   ramo teste → teste.plinc-app.pages.dev (MODO DEMONSTRAÇÃO) e teste.plinc-site.pages.dev
# Precisa dos segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID.
# Enquanto eles não existem, este passo só avisa e não faz nada (o GitHub Pages continua igual).
on:
  push:
    branches: [main, teste]
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  testes:
    uses: ./.github/workflows/testes.yml

  publicar:
    needs: testes
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Conferir se a Cloudflare já está ligada
        id: ligada
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare ainda não configurada (faltam os segredos). Nada publicado."
            echo "ok=nao" >> "$GITHUB_OUTPUT"
          else
            echo "ok=sim" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ligada.outputs.ok == 'sim'
      - uses: actions/setup-node@v4
        if: steps.ligada.outputs.ok == 'sim'
        with:
          node-version: 20
      - name: Montar os sites
        if: steps.ligada.outputs.ok == 'sim'
        run: scripts/montar-sites.sh ${{ github.ref_name == 'main' && 'producao' || 'teste' }}
      - name: Criar os projetos na Cloudflare (só na primeira vez)
        if: steps.ligada.outputs.ok == 'sim'
        run: |
          # se já existir, o "create" só reclama e seguimos
          npx --yes wrangler@4 pages project create plinc-app  --production-branch main || true
          npx --yes wrangler@4 pages project create plinc-site --production-branch main || true
      - name: Publicar
        if: steps.ligada.outputs.ok == 'sim'
        run: |
          MSG="$(git log -1 --format='%h %s' | cut -c1-80)"
          npx --yes wrangler@4 pages deploy dist/app  --project-name plinc-app  --branch "${{ github.ref_name }}" --commit-message "$MSG" --commit-dirty=true
          npx --yes wrangler@4 pages deploy dist/site --project-name plinc-site --branch "${{ github.ref_name }}" --commit-message "$MSG" --commit-dirty=true
